# Sobe a Gestão de Pedidos inteira: docker compose up
# Senhas: padrões só de desenvolvimento (ADR 0012), sobrescritos por um .env (ver .env.example).

x-senhas: &senhas
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dev_Joya_Sa_2026!}
  SENHA_API: ${SENHA_API:-Pedidos_Local_2026!}

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dev_Joya_Sa_2026!}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - dados-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Execução única: aplica os scripts de database/ e termina.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    entrypoint: ["/bin/bash", "/database/init/aplicar-scripts.sh"]
    environment: *senhas
    volumes:
      - ./database:/database:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment:
      ConnectionStrings__Pedidos: "Server=db,1433;Database=JoyaPedidos;User Id=joya_api;Password=${SENHA_API:-Pedidos_Local_2026!};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      db-init:
        condition: service_completed_successfully

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - api
    # O healthcheck passa pelo proxy: web saudável = nginx -> API -> banco funcionando.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q Healthy"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  dados-sql:
